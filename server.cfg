# Configuration FXServer pour faire tourner gta-mode sous Docker.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Ressources de base.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure baseevents
ensure hardcap

# La carte par défaut
ensure fivem-map-skater

# Le mode de jeu (notre dépôt monté dans le container)
ensure gta-mode

sv_hostname "Points"
sv_maxclients 32
sv_scriptHookAllowed 0

# La clé de licence est passée via la variable d'environnement LICENSE_KEY dans docker-compose.yml.
# Vous n'avez pas besoin de la mettre ici si vous utilisez Docker avec un fichier .env.

add_ace group.admin command allow
add_principal identifier.fivem:1 group.admin
